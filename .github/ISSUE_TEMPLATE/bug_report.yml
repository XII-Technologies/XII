name: Bug Report
description: Report a functional issue or unexpected behavior
title: "[Bug]: "
labels: ["Status: Review Requested", "Change: Defect Correction"]
body:
  - type: markdown
    attributes:
      value: |
        **Please fill in the details below to help us reproduce and address this issue effectively.**

  - type: input
    id: version
    attributes:
      label: Engine Version / Commit
      placeholder: "e.g. v0.9.1 or commit hash"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Platform and toolchain
      description: OS/version, architecture, compiler/version, CMake version, generator, preset/filter, and Debug/Dev/Shipping configuration.
    validations:
      required: true

  - type: textarea
    id: graphics
    attributes:
      label: Graphics environment (when applicable)
      description: Backend, GPU, driver, Vulkan loader/SDK or other SDK versions, and desktop/headless session.

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What behavior did you observe? What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Build the engine with XYZ settings
        2. Run 'SampleScene'
        3. Observe rendering anomaly
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots (optional)
      placeholder: Drag screenshots or console logs here
      render: shell
    validations:
      required: false

  - type: dropdown
    id: subsystems
    attributes:
      label: Affected Area
      multiple: true
      options:
        - "Area: Foundation"
        - "Area: Core"
        - "Area: Graphics"
        - "Area: Compute"
        - "Area: I/O"
        - "Area: UI"
        - "Area: Scripting"
        - "Area: Platform"
        - "Area: Asset Pipeline"
        - "Area: Build System"
        - "Area: Editor"
        - "Area: Tools"
        - "Area: Tests"
        - "Area: Samples"
        - "Area: Documentation"
        - "Area: Dependencies"
        - "Area: Plugins"
        - "GitHub"
    validations:
      required: true
