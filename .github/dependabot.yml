version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: Development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'GitHub'
  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: Development
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'ThirdParty'
