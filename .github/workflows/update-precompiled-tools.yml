name: Build precompiled tool candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: precompiled-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      _CL_: /MP2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Configure tool candidates
        run: |
          cmake --preset ci-windows -B Workspace/precompiled-tools -DXII_OUTPUT_DIRECTORY_DLL="$env:GITHUB_WORKSPACE/Workspace/precompiled-tools/Bin" -DXII_OUTPUT_DIRECTORY_LIB="$env:GITHUB_WORKSPACE/Workspace/precompiled-tools/Lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build ArchiveTool candidate
        run: |
          cmake --build Workspace/precompiled-tools --config Shipping --target ArchiveTool --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XII-tools-windows-x64-Shipping-${{ github.sha }}
          path: Workspace/precompiled-tools/Bin/WinVs2026Shipping64/
          if-no-files-found: error
          retention-days: 14
