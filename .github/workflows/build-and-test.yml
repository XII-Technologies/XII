name: XII Build + Unit Tests

on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly run

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout XII repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          clean: false

      - name: Read SDK Version
        id: sdk-version
        uses: juliangruber/read-file-action@v1
        with:
          path: ./version.txt

      - name: Echo SDK Version
        shell: bash
        run: echo "SDK Version is ${{ steps.sdk-version.outputs.content }}"

      # Platform-specific setup
      - name: Setup MSBuild (Windows only)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake

      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake.exe -S . -B build -G "Visual Studio 17 2022" -A x64 \
              -DXII_ENABLE_QT_SUPPORT=ON -DXII_BUILD_SAMPLES=OFF -DXII_BUILD_UNITTESTS=ON
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cmake -S . -B build -G Ninja \
              -DXII_ENABLE_QT_SUPPORT=ON -DXII_BUILD_SAMPLES=OFF -DXII_BUILD_UNITTESTS=ON
          else
            cmake -S . -B build -G Xcode \
              -DXII_ENABLE_QT_SUPPORT=ON -DXII_BUILD_SAMPLES=OFF -DXII_BUILD_UNITTESTS=ON
          fi

      - name: Build Solution
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            msbuild build/solution.sln /p:Configuration=Dev
          else
            cmake --build build --config Debug
          fi

      # Unit tests
      - name: Run FoundationTest
        if: runner.os == 'Windows'
        shell: bash
        run: build/Output/Bin/WinVs2022Dev64/FoundationTest.exe -nosave -nogui -all -outputDir Test/FoundationTest

      - name: Run CoreTest
        if: runner.os == 'Windows'
        shell: bash
        run: build/Output/Bin/WinVs2022Dev64/CoreTest.exe -nosave -nogui -all -outputDir Test/CoreTest

      - name: Run ToolsFoundationTest
        if: runner.os == 'Windows'
        shell: bash
        run: build/Output/Bin/WinVs2022Dev64/ToolsFoundationTest.exe -nosave -nogui -all -outputDir Test/ToolsFoundationTest

      - name: Run FoundationTest (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: build/Output/Bin/FoundationTest -nosave -nogui -all -outputDir Test/FoundationTest

      - name: Run CoreTest (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: build/Output/Bin/CoreTest -nosave -nogui -all -outputDir Test/CoreTest

      - name: Run ToolsFoundationTest (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: build/Output/Bin/ToolsFoundationTest -nosave -nogui -all -outputDir Test/ToolsFoundationTest

      # Upload test results artifacts
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XII.TestResults.${{ matrix.os }}.${{ steps.sdk-version.outputs.content }}
          path: Test
          retention-days: 7
