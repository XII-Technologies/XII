name: Build and Test

on:
  push:
    branches: [Development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.toolchain.name }} / ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        configuration: [Debug, Dev, Shipping]
        toolchain:
          - name: Windows / MSVC (VS 2026)
            os: windows-2025-vs2026
            preset: ci-windows
          - name: Linux / GCC 15
            os: ubuntu-26.04
            preset: ci-linux-gcc
          - name: Linux / Clang 22
            os: ubuntu-26.04
            preset: ci-linux-clang
    uses: ./.github/workflows/native-build.yml
    with:
      os: ${{ matrix.toolchain.os }}
      preset: ${{ matrix.toolchain.preset }}
      configuration: ${{ matrix.configuration }}

  required:
    name: Build and Test required
    if: always()
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Require every native build and test job
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success
