name: Native CI

on:
  push:
    branches: [Development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC Debug
            os: windows-2025
            preset: ci-windows
            configuration: Debug
          - name: Windows MSVC Shipping
            os: windows-2025
            preset: ci-windows
            configuration: Shipping
          - name: Linux GCC Debug
            os: ubuntu-24.04
            preset: ci-linux-gcc
            configuration: Debug
    uses: ./.github/workflows/native-build.yml
    with:
      os: ${{ matrix.os }}
      preset: ${{ matrix.preset }}
      configuration: ${{ matrix.configuration }}

  required:
    name: Native CI required
    if: always()
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native build and test job
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success
