name: macOS port validation

on:
  push:
    branches: [TE/CI]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    uses: ./.github/workflows/native-build.yml
    with:
      os: macos-26
      preset: ci-macos
      configuration: Debug
