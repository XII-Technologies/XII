name: Code quality

on:
  pull_request:
  push:
    branches: [Development]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install configuration validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yamllint
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflows, YAML, and repository contracts
        run: |
          "$RUNNER_TEMP/actionlint" -color
          yamllint .github
          python3 Utilities/CI/check_repository.py
          python3 Utilities/CI/manage_labels.py check
          python3 -m unittest discover -s Utilities/CI/tests -v
