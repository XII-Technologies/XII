name: Auto Label Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.API_TOKEN_GITHUB }}"
          # configuration-path: .github/labeler.yml
