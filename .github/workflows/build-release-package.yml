name: Release validation and source package

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Validate tag and archive source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check release identity
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 Utilities/CI/package_source.py --tag "$RELEASE_TAG" --output Workspace/Release
          git merge-base --is-ancestor HEAD origin/Development
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-source
          path: Workspace/Release/*
          if-no-files-found: error
          retention-days: 14
  windows:
    name: Windows Shipping gate
    needs: source
    uses: ./.github/workflows/native-build.yml
    with:
      os: windows-2025
      preset: ci-windows
      configuration: Shipping
  linux:
    name: Linux Shipping gate
    needs: source
    uses: ./.github/workflows/native-build.yml
    with:
      os: ubuntu-24.04
      preset: ci-linux-gcc
      configuration: Shipping
  quality:
    needs: source
    uses: ./.github/workflows/code-quality.yml
  publish:
    name: Attest and create draft release
    needs: [source, windows, linux, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Only this run's fixed-name artifact, produced from the validated tag.
      # No checkout or execution of engine/contributor code in this privileged job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-source
          path: release
      - name: Verify archive checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tar.gz
      - name: Create draft with generated release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --generate-notes --title "XII $RELEASE_TAG" --notes 'Source snapshot only. Submodule payloads are excluded; their exact revisions are recorded in the manifest. Clone recursively to build. Hosted gates cover CPU modules only; no editor, graphics runtime, binary SDK, or reproducible-build certification is implied. See Documentation/Infrastructure.md.'
