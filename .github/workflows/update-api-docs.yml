name: Update API Docs

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Doxygen
        run: |
          sudo apt-get update -y
          sudo apt-get install -y graphviz
          mkdir Documentation/ThirdParty/
          wget https://github.com/doxygen/doxygen/releases/download/Release_1_13_2/doxygen-1.13.2.linux.bin.tar.gz -P Documentation/ThirdParty/
          cd Documentation/ThirdParty
          tar -xzf doxygen-1.13.2.linux.bin.tar.gz
          cd doxygen-1.13.2
          sudo make install
          cd ../../../

      - name: Run Doxygen
        run: |
          mkdir Output
          cd Documentation
          doxygen Doxyfile

      - name: Checkout host repository
        uses: actions/checkout@v4
        with:
          repository: XII-Technologies/APIDocumentation
          path: _generated
          fetch-depth: 1
          persist-credentials: false

      - name: Copy to host repository
        run: |
          rm -rf _generated/docs/*
          cp -r Output/Doxygen/html/* _generated/docs

      - name: Commit
        run: |
          export GIT_COMMITTER_NAME=$(git show -s --format='%cn')
          export GIT_COMMITTER_EMAIL=$(git show -s --format='%ce')
          export GIT_AUTHOR_NAME=$(git show -s --format='%an')
          export GIT_AUTHOR_EMAIL=$(git show -s --format='%ae')
          export COMMIT_HASH=$(git show -s --format='%H')
          export SUBJECT=$(git show -s --format='%s')
          cd _generated
          git add .
          git commit -m "$SUBJECT" -m "Original commit: $COMMIT_HASH"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.API_TOKEN_GITHUB }}
          branch: Development
          directory: _generated
          repository: XII-Technologies/APIDocumentation
          force: true
