name: Generate API documentation

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the generated documentation to APIDocumentation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: api-documentation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz
      - name: Generate documentation
        working-directory: Documentation
        run: |
          mkdir -p ../Output
          doxygen Doxyfile
          test -f ../Output/Doxygen/html/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-documentation
          path: Output/Doxygen/html/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: inputs.publish && github.ref == 'refs/heads/Development'
    needs: build
    environment: documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted publication utility
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: XII-Technologies/APIDocumentation
          ref: Development
          path: host
          token: ${{ secrets.API_DOCS_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-documentation
          path: generated
      - name: Publish without rewriting history
        env:
          GH_TOKEN: ${{ secrets.API_DOCS_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git -C host config user.name 'github-actions[bot]'
          git -C host config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          python3 automation/Utilities/CI/publish_api_docs.py --checkout host --generated generated --source-sha "$SOURCE_SHA"
