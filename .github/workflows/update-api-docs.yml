name: Generate API documentation

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the generated documentation to APIDocumentation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: api-documentation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz
      - name: Generate documentation
        working-directory: Documentation
        run: |
          mkdir -p ../Output
          doxygen Doxyfile
          test -f ../Output/Doxygen/html/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-documentation
          path: Output/Doxygen/html/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: inputs.publish && github.ref == 'refs/heads/Development'
    needs: build
    environment: documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: XII-Technologies/APIDocumentation
          ref: Development
          path: host
          token: ${{ secrets.API_DOCS_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-documentation
          path: generated
      - name: Publish without rewriting history
        env:
          GH_TOKEN: ${{ secrets.API_DOCS_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p host/docs
          rsync -a --delete generated/ host/docs/
          cd host
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Documentation: Update API reference for $SOURCE_SHA."
          gh auth setup-git
          git push origin HEAD:Development
